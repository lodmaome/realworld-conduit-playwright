name: CI

# Which tier of tests runs depends on what triggered the run — see
# docs/adr/0008-test-tiers-and-ci-triggers.md.
#   pull request      -> smoke       (fast gate, one happy path per feature area)
#   push to main      -> regression  (all functional tests)
#   nightly / manual  -> full        (everything, including visual and a11y)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Which test tier to run
        type: choice
        options: [smoke, regression, full]
        default: full
      publish_branch:
        description: >-
          Where the report and flake history are published. Leave as gh-pages on main. On any other
          branch, name a rehearsal branch (gh-pages-<something>) to run the whole publish path
          without touching the real history; a run elsewhere publishes nothing.
        type: string
        default: gh-pages

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Types, lint, tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:tags
      - run: npm run check:playwright-image
      - run: npm run check:links
      - run: npm run test:tools

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIER: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'push' && 'regression' || github.event_name == 'workflow_dispatch' && inputs.tier || 'full' }}
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      # The report job needs to know which tier ran, to name the report.
      - name: Record the tier
        id: tier
        run: echo "tier=$TIER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the application
        run: |
          cp .env.example .env
          npm run docker:up
      - name: Wait for the application
        run: npm run wait-for-app

      - name: Run ${{ env.TIER }} tests
        run: npm run "test:${TIER}"

      # On a pull request that touches the API contract or the backend pin, say which changed
      # endpoints no test reaches (docs/adr/0014). Every other change skips this: recording
      # re-runs the api, ui and ui-mocked suites, which costs a couple of minutes. Report-only;
      # the step fails only if the tests do or the tool cannot give an honest answer.
      - name: Did the API contract change?
        if: ${{ github.event_name == 'pull_request' }}
        id: contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- api-client/schema.d.ts docker/docker-compose.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record which endpoints the tests reach
        if: ${{ steps.contract.outputs.changed == 'true' }}
        run: npm run coverage:record
      - name: Flag changed endpoints no test reaches
        if: ${{ steps.contract.outputs.changed == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/coverage-gap/cli.mjs --base "$BASE_SHA"

      # The visual suite runs in a container as root and writes into the bind-mounted results
      # directories. Reclaim them, or the host steps below can't clean or overwrite them.
      - name: Reclaim ownership of container-written results
        if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" test-results playwright-report allure-results flake-results 2>/dev/null || true

      # Known-flaky tests run on the full tier only, and never fail the build.
      - name: Run quarantined tests (non-blocking)
        if: ${{ !cancelled() && env.TIER == 'full' }}
        continue-on-error: true
        run: npm run test:quarantine

      # Retries keep a flaky test from failing the run, so say which ones needed one. Reports
      # only; the budget check in the report job decides when it's too many.
      - name: Summarise flaky tests
        if: ${{ !cancelled() }}
        run: node tools/flake-report/summary.mjs

      - name: Collect application logs
        if: ${{ failure() }}
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --no-color > docker-logs.txt
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.TIER }}
          path: |
            playwright-report/
            test-results/
            docker-logs.txt
          retention-days: 14
          if-no-files-found: ignore
      # Its own single-path artifact: with several paths, upload-artifact roots the archive at
      # their common ancestor, so the layout would depend on which of them happened to exist.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1
          if-no-files-found: warn
      - name: Upload flake results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flake-results
          path: flake-results/
          retention-days: 1
          if-no-files-found: warn

  report:
    name: Publish Allure report
    needs: test
    # A red run is the one most worth reading, so this runs after failures too — but never for
    # a pull request (its results shouldn't enter the trend) and not for a cancelled run.
    # The history and the flake budget are only meant to see the default branch, so a run on any
    # other branch publishes only if it names a rehearsal branch to publish to instead
    # (docs/adr/0012-flake-handling.md, amendment).
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && needs.test.result != 'skipped'
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || (github.event_name == 'workflow_dispatch'
      && inputs.publish_branch != ''
      && inputs.publish_branch != 'gh-pages')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Publishing reads the history from the branch and writes it back, so two runs must not
    # overlap; queue them rather than cancelling one.
    concurrency:
      group: allure-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download Allure results
        id: results
        # If the test job died before uploading, there is nothing to publish; that failure is
        # already reported by the test job, so don't add a second red X for it.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Download flake results
        # Optional: without it the publish step carries the existing flake history forward.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: flake-results
          path: flake-results
      - name: Publish the report
        if: ${{ steps.results.outcome == 'success' }}
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Checked in code before anything is pushed (tools/ci/publish-branch.mjs): the publisher
          # force-pushes, so it only writes to gh-pages or gh-pages-<something>.
          PUBLISH_BRANCH: ${{ inputs.publish_branch || 'gh-pages' }}
          TIER: ${{ needs.test.outputs.tier }}
          # Quoted: unquoted, YAML reads " #" as the start of a comment and drops the run number.
          ALLURE_REPORT_NAME: 'RealWorld Conduit · ${{ needs.test.outputs.tier }} · run #${{ github.run_number }}'
        run: node tools/ci/publish-allure-report.mjs
      # After publishing, so the dashboard exists to explain a failure here.
      - name: Check the flake budget
        if: ${{ steps.results.outcome == 'success' }}
        run: node tools/flake-report/check-policy.mjs
