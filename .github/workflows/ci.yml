name: CI

# Which tier of tests runs depends on what triggered the run — see
# docs/adr/0008-test-tiers-and-ci-triggers.md.
#   pull request      -> smoke       (fast gate, one happy path per feature area)
#   push to main      -> regression  (all functional tests)
#   nightly / manual  -> full        (everything, including visual and a11y)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Which test tier to run
        type: choice
        options: [smoke, regression, full]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Types, lint, tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:tags
      - run: npm run check:playwright-image

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIER: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'push' && 'regression' || github.event_name == 'workflow_dispatch' && inputs.tier || 'full' }}
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      # The report job needs to know which tier ran, to name the report.
      - name: Record the tier
        id: tier
        run: echo "tier=$TIER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the application
        run: |
          cp .env.example .env
          npm run docker:up
      - name: Wait for the application
        run: npm run wait-for-app

      - name: Run ${{ env.TIER }} tests
        run: npm run "test:${TIER}"

      # The visual suite runs in a container as root and writes into the bind-mounted results
      # directories. Reclaim them, or the host steps below can't clean or overwrite them.
      - name: Reclaim ownership of container-written results
        if: ${{ !cancelled() }}
        run: sudo chown -R "$(id -u):$(id -g)" test-results playwright-report allure-results 2>/dev/null || true

      # Known-flaky tests run on the full tier only, and never fail the build.
      - name: Run quarantined tests (non-blocking)
        if: ${{ !cancelled() && env.TIER == 'full' }}
        continue-on-error: true
        run: npm run test:quarantine

      - name: Collect application logs
        if: ${{ failure() }}
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --no-color > docker-logs.txt
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.TIER }}
          path: |
            playwright-report/
            test-results/
            docker-logs.txt
          retention-days: 14
          if-no-files-found: ignore
      # Its own single-path artifact: with several paths, upload-artifact roots the archive at
      # their common ancestor, so the layout would depend on which of them happened to exist.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1
          if-no-files-found: warn

  report:
    name: Publish Allure report
    needs: test
    # A red run is the one most worth reading, so this runs after failures too — but never for
    # a pull request (its results shouldn't enter the trend) and not for a cancelled run.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Publishing reads the history from the branch and writes it back, so two runs must not
    # overlap; queue them rather than cancelling one.
    concurrency:
      group: allure-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download Allure results
        id: results
        # If the test job died before uploading, there is nothing to publish; that failure is
        # already reported by the test job, so don't add a second red X for it.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Publish the report
        if: ${{ steps.results.outcome == 'success' }}
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Quoted: unquoted, YAML reads " #" as the start of a comment and drops the run number.
          ALLURE_REPORT_NAME: 'RealWorld Conduit · ${{ needs.test.outputs.tier }} · run #${{ github.run_number }}'
        run: node tools/ci/publish-allure-report.mjs
