server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular uses client-side routing; unknown paths (e.g. a direct navigation to
    # /article/some-slug) must fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
