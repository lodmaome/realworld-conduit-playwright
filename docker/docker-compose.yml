services:
  backend:
    build:
      context: https://github.com/realworld-apps/aspnetcore-realworld-example-app.git#a397d1197b22edeffa4d2563fa5f4f7f11d0b254
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    # No database env vars: the pinned commit hardcodes SQLite regardless of what its
    # own docker-compose.yml suggests — see docs/adr/0006-backend-database-provider.md.
    #
    # No in-container HEALTHCHECK: we don't control this Dockerfile or its base image,
    # so we can't assume curl/wget exists inside it. Readiness is polled externally
    # instead — see tools/ci/wait-for-app.mjs (`npm run wait-for-app`).

  frontend:
    build:
      context: ./frontend
      args:
        FRONTEND_REF: dd99ed2cf39c805d719f943c5d7061a5683d98a8
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    ports:
      - '${FRONTEND_PORT:-4200}:80'
    depends_on:
      # Order only — the container starting doesn't mean the app inside is ready.
      - backend

  # The pinned image the visual suite runs in (docs/adr/0009). Not part of `docker:up`:
  # it's a one-shot runner, started with `npm run test:visual`.
  playwright:
    profiles: ['tests']
    build:
      context: ..
      dockerfile: docker/playwright/Dockerfile
    init: true
    # Chromium needs more shared memory than Docker's 64MB default allows.
    ipc: host
    environment:
      # On the compose network the frontend is reachable by service name. The visual suite
      # stubs the API, so it needs no backend URL.
      FRONTEND_BASE_URL: http://frontend
      CI: ${CI:-}
    volumes:
      # Sources are mounted rather than baked in, so a spec edit doesn't rebuild the image.
      - ../tests:/work/tests
      - ../pages:/work/pages
      - ../factories:/work/factories
      - ../api-client:/work/api-client
      # The flake reporter is loaded by playwright.config.ts, so it has to exist in here too.
      - ../tools/flake-report:/work/tools/flake-report:ro
      - ../playwright.config.ts:/work/playwright.config.ts:ro
      - ../tsconfig.json:/work/tsconfig.json:ro
      # Results and reports land on the host, where CI uploads them from.
      - ../test-results:/work/test-results
      - ../playwright-report:/work/playwright-report
      - ../allure-results:/work/allure-results
      - ../flake-results:/work/flake-results
    depends_on:
      - frontend
